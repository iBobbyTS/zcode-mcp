[package]
name = "review-ledger"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
review-preparation = { path = "../review-preparation" }
review-store = { path = "../review-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.51", default-features = false }
tempfile = "3"
