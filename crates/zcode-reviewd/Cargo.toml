[package]
name = "zcode-reviewd"
version = "0.1.0"
edition = "2021"

[dependencies]
zcode-driver = { path = "../zcode-driver" }
review-store = { path = "../review-store" }
review-preparation = { path = "../review-preparation" }
review-ledger = { path = "../review-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcode-protocol = { path = "../zcode-protocol" }
signal-hook = "0.3"
libc = "0.2"
sha2 = "0.10"
socket2 = "0.6"

[dev-dependencies]
jsonschema = { version = "0.51", default-features = false }
tempfile = "3"
rusqlite = "0.32"
