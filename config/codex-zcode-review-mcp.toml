# Merge this table into ~/.codex/config.toml and replace the absolute paths.
[mcp_servers.zcode_review]
command = "/absolute/path/to/zcode-mcp/target/release/zcode-review-mcp"
enabled = true
required = true
startup_timeout_sec = 10
tool_timeout_sec = 10
enabled_tools = [
  "zcode_review_spawn",
  "zcode_review_status",
  "zcode_review_events",
  "zcode_review_wait",
  "zcode_review_message",
  "zcode_review_respond",
  "zcode_review_stop",
  "zcode_review_result",
  "zcode_review_list",
  "zcode_review_close",
]
default_tools_approval_mode = "prompt"

[mcp_servers.zcode_review.env]
ZCODE_REVIEWD_SOCKET = "/absolute/private/zcode-reviewd.sock"

[mcp_servers.zcode_review.tools.zcode_review_status]
approval_mode = "auto"

[mcp_servers.zcode_review.tools.zcode_review_events]
approval_mode = "auto"

[mcp_servers.zcode_review.tools.zcode_review_wait]
approval_mode = "auto"

[mcp_servers.zcode_review.tools.zcode_review_result]
approval_mode = "auto"

[mcp_servers.zcode_review.tools.zcode_review_list]
approval_mode = "auto"

[mcp_servers.zcode_review.tools.zcode_review_spawn]
approval_mode = "prompt"

[mcp_servers.zcode_review.tools.zcode_review_message]
approval_mode = "prompt"

[mcp_servers.zcode_review.tools.zcode_review_respond]
approval_mode = "prompt"

[mcp_servers.zcode_review.tools.zcode_review_stop]
approval_mode = "prompt"

[mcp_servers.zcode_review.tools.zcode_review_close]
approval_mode = "prompt"
